name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 1 * *'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &setup_repository
        name: Set up repository
        uses: ./.github/actions/setup-repository

      - name: Verify formatting
        run: vp run format

      - name: Construct package prerequisite
        run: vp run pack

      - name: Run type-aware linting
        run: vp run lint

      - name: Run TypeScript checking
        run: vp run typecheck

      - name: Run Effect diagnostics
        run: vp run effect-check

      - name: Run Vitest
        run: vp run test

      - name: Run Fallow audits
        run: vp run fallow

  package-contract:
    name: Package contract
    needs: source-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - *checkout
      - *setup_repository

      - name: Construct and inspect package
        run: vp run pack

      - name: Verify packed consumers and type scale
        run: vp run packed-package

      - name: Preserve verified package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ github.sha }}
          path: .artifacts/*.tgz
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  example-builds:
    name: Example builds
    needs: source-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - *checkout
      - *setup_repository

      - name: Build Vite React application
        run: vp run vite-react-build

      - name: Build TanStack Start application
        run: vp run tanstack-start-build

  documentation:
    name: Documentation
    needs: source-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - *checkout
      - *setup_repository

      - name: Check documentation
        run: vp run docs-check

      - name: Build documentation
        run: vp run docs-build

  browser:
    name: Playwright (${{ matrix.browser }})
    needs:
      - package-contract
      - example-builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - *checkout
      - *setup_repository

      - name: Install ${{ matrix.browser }}
        run: vp exec playwright install --with-deps ${{ matrix.browser }}

      - name: Check documentation in ${{ matrix.browser }}
        run: vp run docs-e2e -- --project=${{ matrix.browser }}

      - name: Run ${{ matrix.browser }} acceptance tests
        run: vp run e2e:${{ matrix.browser }}

      - name: Preserve Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.browser }}-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
