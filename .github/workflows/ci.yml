name: CI

on:
  pull_request:
  schedule:
    - cron: "17 4 1 * *"
  workflow_call:
  workflow_dispatch:
    inputs:
      dependency-cache:
        description: Package cache mode for comparing setup times
        type: choice
        default: restore
        options:
          - restore
          - fresh

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - &setup_repository
        name: Set up repository
        uses: ./.github/actions/setup-repository
        with:
          dependency-cache: ${{ inputs.dependency-cache || 'restore' }}

      - name: Verify formatting
        run: vp run format

      - name: Check shipped skills and maintenance reviews
        env:
          INTENT_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: vp run skills-maintenance-check

      - name: Run type-aware linting and TypeScript checking
        run: vp run typecheck

      - name: Check public API compiler fixtures
        run: vp run api-types

      - name: Check native framework consumers
        run: vp run framework-types

      - name: Run Effect diagnostics
        run: vp run effect-check

      - name: Run Fallow audits
        run: vp run fallow

      - name: Run Vitest
        run: vp run test

  packed-compatibility:
    name: Packed compatibility (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]

    steps:
      - *checkout
      - *setup_repository

      - name: Check packed Effect and Query Core consumers
        env:
          SHARD: ${{ matrix.shard }}
        run: vp run effect-compatibility --shard="$SHARD"

  source-quality:
    name: Source quality
    needs: [source-checks, packed-compatibility]
    if: ${{ !cancelled() }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all source checks
        env:
          SOURCE_RESULT: ${{ needs.source-checks.result }}
          COMPATIBILITY_RESULT: ${{ needs.packed-compatibility.result }}
        run: test "$SOURCE_RESULT" = success && test "$COMPATIBILITY_RESULT" = success

  example-builds:
    name: Example builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - *checkout
      - *setup_repository

      - name: Build Vite React application
        run: vp run vite-react-build

      - name: Build TanStack Start application
        run: vp run tanstack-start-build

      - name: Preserve application builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-builds
          path: |
            dist
            examples/vite-react/dist
            examples/tanstack-start/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - *checkout
      - *setup_repository

      - name: Check documentation
        run: vp run docs-check

      - name: Build documentation
        run: vp run docs-build

      - name: Preserve documentation build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-build
          path: apps/docs/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  browser-shards:
    name: Playwright (${{ matrix.browser }}, ${{ matrix.shard }})
    needs:
      - example-builds
      - documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
        shard: ["1/2", "2/2"]

    steps:
      - *checkout

      - name: Set container home ownership
        run: chown "$(id -u):$(id -g)" "$HOME"

      - name: Verify Playwright image version
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { readFileSync } = require("node:fs");
          const { driverVersion } = JSON.parse(readFileSync("/ms-playwright/.docker-info", "utf8"));
          const expected = require("./package.json").devDependencies["@playwright/test"];
          assert.equal(driverVersion, expected, "Update the Playwright image tag and digest with @playwright/test.");
          NODE

      - *setup_repository

      - name: Restore application builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-builds

      - name: Restore documentation build
        if: matrix.shard == '2/2'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-build
          path: apps/docs/dist

      - name: Check documentation in ${{ matrix.browser }}
        if: matrix.shard == '2/2'
        env:
          BROWSER: ${{ matrix.browser }}
        run: vp run --ignore-depends-on docs-e2e --project="$BROWSER"

      - name: Run ${{ matrix.browser }} acceptance tests
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
        run: vp run --ignore-depends-on "e2e:$BROWSER" --shard="$SHARD"

      - name: Preserve Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.browser }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Playwright (${{ matrix.browser }})
    needs: browser-shards
    if: ${{ !cancelled() }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Require all Playwright shards
        env:
          SHARDS_RESULT: ${{ needs.browser-shards.result }}
        run: test "$SHARDS_RESULT" = success
