name: CI

on:
  pull_request:
  schedule:
    - cron: "17 4 1 * *"
  workflow_call:
  workflow_dispatch:
    inputs:
      dependency-cache:
        description: Package cache mode for comparing setup times
        type: choice
        default: fresh
        options:
          - fresh
          - restore

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - &setup_repository
        name: Set up repository
        uses: ./.github/actions/setup-repository
        with:
          dependency-cache: ${{ inputs.dependency-cache || 'fresh' }}

      - name: Verify formatting
        run: vp run format

      - name: Check shipped skills and maintenance reviews
        env:
          INTENT_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: vp run skills-maintenance-check

      - name: Run type-aware linting and TypeScript checking
        run: vp run typecheck

      - name: Check public API compiler fixtures
        run: vp run api-types

      - name: Check native framework consumers
        run: vp run framework-types

      - name: Run Effect diagnostics
        run: vp run effect-check

      - name: Run Fallow audits
        run: vp run fallow

      - name: Run Vitest
        run: vp run test

  packed-compatibility:
    name: Packed compatibility (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]

    steps:
      - *checkout
      - *setup_repository

      - name: Check packed Effect and Query Core consumers
        env:
          SHARD: ${{ matrix.shard }}
        run: vp run effect-compatibility --shard="$SHARD"

  source-quality:
    name: Source quality
    needs: [source-checks, packed-compatibility]
    if: ${{ !cancelled() }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all source checks
        env:
          SOURCE_RESULT: ${{ needs.source-checks.result }}
          COMPATIBILITY_RESULT: ${{ needs.packed-compatibility.result }}
        run: test "$SOURCE_RESULT" = success && test "$COMPATIBILITY_RESULT" = success

  example-builds:
    name: Example builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - *checkout
      - *setup_repository

      - name: Build Vite React application
        run: vp run vite-react-build

      - name: Build TanStack Start application
        run: vp run tanstack-start-build

      - name: Preserve application builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-builds
          path: |
            dist
            examples/vite-react/dist
            examples/tanstack-start/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - *checkout
      - *setup_repository

      - name: Check documentation
        run: vp run docs-check

      - name: Build documentation
        run: vp run docs-build

      - name: Preserve documentation build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-build
          path: apps/docs/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  browser-shards:
    name: Build and test in Playwright
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/playwright.yml
    with:
      build-locally: true
      dependency-cache: ${{ inputs.dependency-cache || 'fresh' }}

  browser-shards-from-artifacts:
    name: Test prepared builds in Playwright
    if: github.event_name != 'pull_request'
    needs: [example-builds, documentation]
    uses: ./.github/workflows/playwright.yml
    with:
      build-locally: false
      dependency-cache: ${{ inputs.dependency-cache || 'fresh' }}

  browser:
    name: Playwright (${{ matrix.browser }})
    needs: [browser-shards, browser-shards-from-artifacts]
    if: ${{ !cancelled() }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Require all Playwright shards
        env:
          LOCAL_RESULT: ${{ needs.browser-shards.result }}
          ARTIFACT_RESULT: ${{ needs.browser-shards-from-artifacts.result }}
        run: |
          test "$LOCAL_RESULT:$ARTIFACT_RESULT" = success:skipped ||
            test "$LOCAL_RESULT:$ARTIFACT_RESULT" = skipped:success
