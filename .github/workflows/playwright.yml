name: Playwright

on:
  workflow_call:
    inputs:
      build-locally:
        description: Build applications and docs on their browser runner.
        type: boolean
        required: true
      dependency-cache:
        description: Package cache mode for repository setup.
        type: string
        required: true

permissions:
  contents: read

jobs:
  shards:
    name: Playwright (${{ matrix.browser }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
        shard: ["1/2", "2/2"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set container home ownership
        run: chown "$(id -u):$(id -g)" "$HOME"

      - name: Verify Playwright image version
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { readFileSync } = require("node:fs");
          const { driverVersion } = JSON.parse(readFileSync("/ms-playwright/.docker-info", "utf8"));
          const expected = require("./package.json").devDependencies["@playwright/test"];
          assert.equal(driverVersion, expected, "Update the Playwright image tag and digest with @playwright/test.");
          NODE

      - name: Set up repository
        uses: ./.github/actions/setup-repository
        with:
          dependency-cache: ${{ inputs.dependency-cache }}

      - name: Build applications
        if: inputs.build-locally
        run: |
          vp run vite-react-build
          vp run tanstack-start-build

      - name: Build documentation
        if: inputs.build-locally && matrix.shard == '2/2'
        run: vp run docs-build

      - name: Restore application builds
        if: ${{ !inputs.build-locally }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-builds

      - name: Restore documentation build
        if: ${{ !inputs.build-locally && matrix.shard == '2/2' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-build
          path: apps/docs/dist

      - name: Check documentation in ${{ matrix.browser }}
        if: matrix.shard == '2/2'
        env:
          BROWSER: ${{ matrix.browser }}
        run: vp run --ignore-depends-on docs-e2e --project="$BROWSER"

      - name: Run ${{ matrix.browser }} acceptance tests
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
        run: vp run --ignore-depends-on "e2e:$BROWSER" --shard="$SHARD"

      - name: Preserve Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.browser }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
