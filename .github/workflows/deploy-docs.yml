name: Deploy documentation

on:
  workflow_call:
    inputs:
      build-artifact:
        description: Validated documentation artifact from this workflow run.
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Restore validated documentation
        if: inputs.build-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build-artifact }}
          path: apps/docs/dist

      - name: Check out repository
        if: inputs.build-artifact == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository
        if: inputs.build-artifact == ''
        uses: ./.github/actions/setup-repository

      - name: Check public API and documentation examples
        if: inputs.build-artifact == ''
        run: vp run api-types

      - name: Build documentation
        if: inputs.build-artifact == ''
        run: vp run docs-build

      - name: Upload documentation
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
