name: Deploy documentation

on:
  workflow_call:
    inputs:
      build-artifact:
        description: Validated documentation artifact from this release run.
        required: true
        type: string
      published-packages:
        description: Packages reported by the successful Changesets publish step.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Exact published npm version to document, such as 0.1.0.
        required: true
        type: string
      docs-ref:
        description: Optional branch name or full SHA with only docs changes since that release.
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve:
    name: Verify released documentation revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}
      node-version: ${{ steps.node.outputs.node-version }}

    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Node version
        id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Resolve released source and permitted documentation changes
        id: release
        env:
          BUILD_ARTIFACT: ${{ inputs.build-artifact }}
          PUBLISHED_PACKAGES: ${{ inputs.published-packages }}
          DOCS_VERSION: ${{ inputs.version }}
          DOCS_REF: ${{ inputs.docs-ref }}
        run: node scripts/resolve-docs-release.mts

      - name: Preserve trusted build verifier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-verifier
          path: scripts/resolve-docs-release.mts
          if-no-files-found: error
          retention-days: 7

  build:
    name: Prepare released documentation
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Restore validated documentation from this release run
        if: inputs.build-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-build
          path: apps/docs/dist

      - name: Check out verified documentation revision
        if: inputs.build-artifact == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository
        if: inputs.build-artifact == ''
        uses: ./.github/actions/setup-repository

      - name: Check public API and documentation examples
        if: inputs.build-artifact == ''
        run: vp run api-types

      - name: Build documentation
        if: inputs.build-artifact == ''
        run: vp run docs-build

      - name: Restore trusted build verifier from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-verifier
          path: ${{ runner.temp }}/documentation-verifier

      - name: Set up verified Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ needs.resolve.outputs.node-version }}
          package-manager-cache: false

      - name: Verify documentation package version
        env:
          DOCS_VERSION: ${{ needs.resolve.outputs.version }}
        run: node "$RUNNER_TEMP/documentation-verifier/resolve-docs-release.mts" verify-build

      - name: Upload documentation
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
