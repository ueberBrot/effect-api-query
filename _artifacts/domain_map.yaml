library:
  name: effect-api-query
  version: 0.1.0
  repository: https://github.com/ueberBrot/effect-api-query
  description: TanStack Query utilities derived from ready Effect RPC and HTTP clients.
  primary_framework: framework-agnostic
domains:
  - name: Contract-derived query workflows
    slug: contract-queries
    description: Choose typed cache views while preserving application-owned execution and lifetime.
skills:
  - name: effect-api-query
    slug: effect-api-query
    domain: contract-queries
    description: Derive options and keys, coordinate cache owners, and integrate native Query
      consumers.
    type: core
    packages:
      - effect-api-query
    covers:
      - RPC construction and canonical identity
      - HTTP decoded requests, SSE, multipart mutations, and metadata
      - Inferred operation types, typed policy reuse, native defaults, and view filters
      - Input-field skipping, pagination, stream policies, and lifetime tracing
      - Stream snapshots and request cleanup
      - Optimistic overlap, event refresh, and owner replacement
      - DTO and rich-value hydration
      - Native provider setup, Suspense recovery, reactive accessors, and host boundaries
    tasks:
      - Derive buffered, paginated, accumulated, live, and metadata options from a ready client.
      - Address exact stream policy keys, select supported view prefixes, and compose encoded
        partial native filters.
      - Reuse inferred input, cached query data, and mutation types in application modules.
      - Apply native defaults and typed reusable policies without losing call-site selection,
        conditional input, or explicitly undefined seed behavior.
      - Capture open streams and drain queries, preparation, and accepted writes before request
        disposal.
      - Hydrate every selected view into its normal decoded cache representation.
      - Preserve neighboring writes and originating ownership during mutation overlap.
      - Defer event refresh until participating writes settle.
      - Retire consumers and accepted work before acquiring a replacement owner.
      - Acquire a ready client and mount native providers with awaited cleanup.
      - Recover initial Suspense failures, retain cached data after failed refetches, and start
        independent reads together with native cancellation limits.
      - Trace the consumed Stream and its cleanup while its owning runtime remains alive.
      - Rebuild options inside native reactive framework accessors.
      - Choose an application-owned transport within documented version and host boundaries.
    subsystems:
      - name: RPC
        package: effect-api-query
        config_surface: Literal RpcGroup, flat ready client, prefix, key encoders, runner.
      - name: HTTP
        package: effect-api-query
        config_surface: Literal HttpApi, ready client, prefix, request encoders, runner.
    reference_candidates:
      - topic: Adapter inputs and capabilities
        reason: RPC construction and HTTP decoded containers differ.
      - topic: Cache workflows
        reason: Keys, policies, and native filters are library contracts; writes and replacement
          are application-owned workflows.
      - topic: Hydration and SSR
        reason: Captures, view codecs, and preparation require request lifetime.
      - topic: Frameworks and hosts
        reason: Native providers, Suspense recovery, hook overloads, and transport boundaries are
          conditional integrations rather than package-provided services.
    failure_modes:
      - mistake: Reuse an accumulated key across incompatible policies
        mechanism: Retention and refetch policy change representation and normalized identity.
        wrong_pattern: rpc.events.watch.streamedKey(input)
        correct_pattern: rpc.events.watch.streamedKey(input, policy)
        source: src/rpc/streamed-query.ts
        priority: HIGH
        status: active
      - mistake: Dispose resources after native cancellation alone
        mechanism: Query settlement can precede local finalization; accepted writes and
          preparation may still need the runtime.
        wrong_pattern: await queryClient.cancelQueries(); await runtime.dispose()
        correct_pattern: await acceptedWorkDrain; await runtime.dispose()
        source: examples/tanstack-start/src/lib/application.ts
        priority: HIGH
        status: active
      - mistake: Roll back an overlapping write with an old snapshot
        mechanism: Whole-list replacement erases intervening writes; stale entity restoration
          can overwrite a newer authoritative cache revision.
        wrong_pattern: queryClient.setQueryData(key, oldList)
        correct_pattern: Capture current entity fields and positions for each new write; restore
          them only while its optimistic cache revision remains owned.
        source: examples/vite-react/src/lib/user-writes.ts
        priority: CRITICAL
        status: active
      - mistake: Redirect late callbacks to a replacement owner
        mechanism: Mutable current-owner lookup can send private results to another cache.
        wrong_pattern: currentOwner.queryClient.setQueryData(key, result)
        correct_pattern: transaction.commit(result)
        source: examples/vite-react/src/lib/user-writes.ts
        priority: CRITICAL
        status: active
      - mistake: Hydrate rich values without paired view codecs
        mechanism: JSON loses prototypes, rich page parameters, and distinct undefined elements.
        wrong_pattern: hydrate(queryClient, JSON.parse(snapshot))
        correct_pattern: await decodeAllSelectedViewsThenHydrate(snapshot)
        source: tests/types/docs-hydration-views.ts
        priority: HIGH
        status: active
      - mistake: Construct reactive query options only once
        mechanism: Builders capture the first input and cannot follow reactive changes.
        wrong_pattern: useQuery(rpc.users.read.queryOptions({ input }))
        correct_pattern: 'useQuery(() => rpc.users.read.queryOptions({ input: readInput() }))'
        source: apps/docs/src/content/docs/guides/solid-query.md
        priority: HIGH
        status: active
      - mistake: Rely on changed metadata options after a fresh hit
        mechanism: An imperative fresh cache hit retains the existing Query options.
        wrong_pattern: await queryClient.query(newOptions); queryClient.setQueryData(key, value)
        correct_pattern: Install the policy through an observer or actual fetch before manual writes.
        source: apps/docs/src/content/docs/reference/http-builders.md
        priority: HIGH
        status: active
      - mistake: Assume shared mutation callbacks compose automatically
        mechanism: Call-site callbacks replace policy callbacks, and shared callbacks cannot
          assume the local optimistic context's shape.
        wrong_pattern: 'write({ onSuccess: localSuccess })'
        correct_pattern: Compose required callbacks explicitly and keep onMutate at the call site.
        source: tests/query-policy.test.ts
        priority: HIGH
        status: active
      - mistake: Rely on Suspense cancellation for open streams
        mechanism: Native Suspense hooks do not support cancellation; lifecycle cleanup needs
          an ordinary abort-aware query or observer.
        wrong_pattern: useSuspenseQuery(rpc.events.watch.liveOptions())
        correct_pattern: Use an ordinary Query hook or observer for a stream requiring cancellation.
        source: apps/docs/src/content/docs/guides/react-query.md
        priority: HIGH
        status: active
      - mistake: Trace only the creation of an iterable
        mechanism: The runner's Effect ends before stream consumption and local finalization.
        wrong_pattern: runPromiseExit(effect.pipe(Effect.withSpan('feed.consume')))
        correct_pattern: Acquire Effect.makeSpanScoped inside Stream.unwrap and retain it through
          asynchronous Stream.ensuring cleanup.
        source: tests/types/docs-stream-tracing.ts
        priority: HIGH
        status: active
    compositions:
      - library: TanStack Query
      - library: Effect
tensions:
  - name: Library contracts and application workflows
    skills:
      - effect-api-query
    description: Generated options, keys, inference, and policy binding have a package contract;
      native providers, transports, and domain protocols belong to the application.
    implication: Explain package behavior in library guidance, native consumers in integrations,
      and concrete protocols such as cancellable commands in runnable examples.
  - name: Exact identity and broad refresh
    skills:
      - effect-api-query
    description: Concrete keys include encoding and view policy while native prefixes group
      related entries.
    implication: Partial constructor input or omitted stream policy cannot stand in for an exact
      key.
  - name: Local retirement and accepted domain work
    skills:
      - effect-api-query
    description: Private cache retirement stops local side effects without pretending to undo
      remote writes.
    implication: Keep originating-owner guards after drain and model command cancellation explicitly.
  - name: Policy reuse and call-site inference
    skills:
      - effect-api-query
    description: Shared endpoint-aware defaults reduce repetition while selected data and
      optimistic context depend on each invocation.
    implication: Bind typed policies once per owner, keeping projections, seeds, identity, and
      optimistic context at the call site; compose required callbacks deliberately.
cross_references: []
gaps: []
