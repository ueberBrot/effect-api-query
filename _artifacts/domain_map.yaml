library:
  name: "@ueberbrot/effect-api-query"
  version: 0.8.0
  repository: https://github.com/ueberBrot/effect-api-query
  description: TanStack Query utilities derived from ready Effect RPC and HTTP clients.
  primary_framework: framework-agnostic
domains:
  - name: Contract-derived query workflows
    slug: contract-queries
    description: Choose typed cache views. Keep execution and resource lifetime under application control.
skills:
  - name: effect-api-query
    slug: effect-api-query
    domain: contract-queries
    description: Derive options and keys, coordinate cache owners, and integrate native Query consumers.
    type: core
    packages:
      - "@ueberbrot/effect-api-query"
    covers:
      - RPC construction, explicit prepared inputs, and canonical identity
      - Direct execution on unary RPC and buffered HTTP leaves, plus shared classification of execution failures
      - Query-stable RPC construction and deterministic defaults
      - Immutable captured input and nontransferable prepared-input ownership
      - HTTP decoded requests, SSE and NDJSON, multipart mutations, metadata, and omitted streaming uploads or upgrades
      - Inferred operation types, tree/branch/leaf policy configuration, execution interception, native defaults, and view filters
      - Opt-in schemaStructuralSharing for immutable decoded atoms in plain containers, with explicit equivalence for custom fields and meaningful class state
      - Input-field skipping, pagination, explicit stream retention, publication deadlines, uncached event consumption, owner-scoped event-to-cache recovery, and lifetime tracing
      - Stable Query Core stream publication, native cache writes, independent observer lifetimes, and complete cleanup Causes
      - Opt-in live snapshot coalescing, fixed pending timers with event-loop delay, terminal flush, cancellation discard, configured HTTP decoder identity, and RPC tuple compatibility
      - Stream snapshots and request cleanup
      - Optimistic overlap, event refresh, and owner replacement
      - DTO and rich-value hydration with contract derivation and typed view overrides
      - Loader selections with explicit input codecs and owner validation
      - Optional React owner and utility providers, Suspense recovery, reactive accessors, and host boundaries
    tasks:
      - Check application-owned policy maps against their RPC or HTTP contracts before client acquisition. Type-check SSE settings at the SSE leaf, including flat path entries. Apply policies through configureUtils, which copies decoder settings for keys and options.
      - Use QueryClientService to run queries, warm the cache, and apply cache operations in Effect. Use an exclusive stream snapshot to capture a stream that can stay open.
      - Bind application Reactivity keys to explicit cache filters within a Scope. Retain key prefix isolation and stop invalidation at query owner retirement.
      - Derive buffered, paginated, accumulated, live, and metadata options from a ready client. Use its HTTP request parse options when encoding default keys.
      - Use colocated query filters for lazy-safe branch views and complete canonical leaf inputs. Omit stream policy options to match across policies. Supply retention for a policy match if none is configured. Use explicit projections for encoded partial input.
      - Reuse inferred input, cached query data, and mutation types in application modules.
      - Configure utility trees, branches, and leaves with ordered interceptors across views; reuse unchanged frozen subtrees while preserving policy snapshots and prepared-input ownership; select a branch view without changing key layouts.
      - Reuse owner-bound prepared inputs and configure policies once per owner; rebuild reactive call-site options when input changes.
      - Call buffered leaves through the inherited runtime or compose their client Effects. Reuse prepared input only on its owning leaf.
      - Match single tagged failures and bound native retries without flattening composite Causes.
      - Apply native defaults and scoped policies without losing call-site selection, conditional input, or explicitly undefined seed behavior; compose mutation callbacks or intercept native execution attempts.
      - Reuse equivalent immutable decoded records and nested containers with a schema-specific structuralSharing policy while preserving metadata freezing and generated types.
      - Capture open streams and drain queries, preparation, and accepted writes before request disposal.
      - Derive registries from matching contracts, override unsupported schemas, and hydrate selected views into their decoded cache representation. Use cached HTTP metadata status to select declared successes. Preserve nested union members with overlapping JSON encodings and distinct undefined stream elements. Set view overrides directly on configuration objects.
      - Preserve neighboring writes and originating ownership during mutation overlap.
      - Defer event refresh until participating writes settle.
      - Retire consumers and accepted work before acquiring a replacement owner. Each owner creates its query and mutation caches from configuration and drains registered work before release.
      - Acquire a ready client and track its utility tree for retirement. In React, use a keyed owner provider and await caller-managed cleanup.
      - Recover initial Suspense failures, retain cached data after failed refetches, and start independent reads together with native cancellation limits.
      - Recover stream delivery with numeric convenience or explicit application cursor acceptance/order and gap detection, authoritative replay refresh, full hook inference, and cancellable backoff.
      - Map recovered events explicitly to generated-key updates and filter invalidation in one query owner; await sequential handlers and retirement cleanup, and keep durable checkpoints and retained history under application policy.
      - Trace the consumed Stream and its cleanup while its owning runtime remains alive.
      - Rebuild options inside native reactive framework accessors.
      - Match documentation to the installed package, distinguish declared peer requirements from checked native hook combinations, and choose an application-owned transport within documented host boundaries.
    subsystems:
      - name: RPC
        package: "@ueberbrot/effect-api-query"
        config_surface: Literal RpcGroup, tag-keyed or flat ready client, optional prefix, key encoders, runtime.
      - name: HTTP
        package: "@ueberbrot/effect-api-query"
        config_surface: Literal HttpApi, ready client, optional prefix, request encoders, runtime.
    reference_candidates:
      - topic: Adapter inputs and capabilities
        reason: RPC construction and HTTP decoded containers differ.
      - topic: Cache workflows
        reason: The library defines keys, policies, and native filters. Applications own writes and owner replacement.
      - topic: Hydration and SSR
        reason: Captures, view codecs, and preparation require request lifetime.
      - topic: Frameworks and hosts
        reason: The optional React subpath provides typed context and keyed cache wiring. Hooks and transport remain native to their frameworks and hosts.
    failure_modes:
      - mistake: Treat Reactivity record keys as per-entity subscriptions
        mechanism: Effect matches both the record group and its IDs, so writes can trigger sibling bindings.
        wrong_pattern: "Bind { users: [1] } and expect writes to { users: [2] } to skip that binding."
        correct_pattern: Use a matching string array key for exact events and colocated filters for cache scope. Use distinct Reactivity services for independent owners.
        source: apps/docs/src/content/docs/guides/query-effects.md
        priority: HIGH
        status: active
      - mistake: Assume invalidation immediately refetches inactive queries
        mechanism: QueryClient marks matching entries stale and refetches active matches by default.
        wrong_pattern: Invalidate an unobserved query after a write and read its cache as if the request has completed.
        correct_pattern: Fetch the exact query if the caller needs a fresh result immediately.
        source: apps/docs/src/content/docs/guides/mutations.md
        priority: MEDIUM
        status: active
      - mistake: Treat generic equality or wire serialization as decoded-value equality
        mechanism: Effect equality can cache comparisons and inspect custom objects, while Schema equivalence follows declared fields and annotations.
        wrong_pattern: Use generic Equal.equals or encoded JSON to reuse arbitrary mutable or custom cached objects.
        correct_pattern: Use schemaStructuralSharing with an explicit decoded atom equivalence; include private/extra state, retain custom reference semantics, and require synchronous service-free validation over acyclic plain containers. Pass custom-prototype containers through unchanged. Preserve HTTP metadata freezing.
        source: tests/types/docs-structural-sharing.ts
        priority: HIGH
        status: active
      - mistake: Apply SSE decoder controls to NDJSON views
        mechanism: >-
          NDJSON framing and element limits belong to the Effect declaration; its ready client supplies decoded records without SSE policy.
        wrong_pattern: >-
          http.records.watch.liveOptions({ sseOptions: { maxEventSize: 1024 } })
        correct_pattern: >-
          Declare maxElementBytes on StreamNdjson and use the ordinary accumulated or live builder without sseOptions.
        source: src/http/types.ts
        priority: HIGH
        status: active
      - mistake: Treat an abort before the first live value as empty completion
        mechanism: Empty completion raises the adapter error only while the signal is active.
        wrong_pattern: Suppress empty-stream errors when retiring a query owner.
        correct_pattern: Pass the native signal to the owner and handle cancellation through Query Core. Keep empty completion visible as a failure.
        source: src/core/streamed-query.ts
        priority: HIGH
        status: active
      - mistake: Rely on call order to determine configuration specificity
        mechanism: Configuration layers retain their tree, branch, or leaf scope across repeated calls.
        wrong_pattern: Expect a later tree policy to replace an existing leaf policy.
        correct_pattern: Configure the intended scope; later values replace earlier ones within that same scope.
        source: src/core/configure-utils.ts
        priority: HIGH
        status: active
      - mistake: Drop a protocol's empty named SSE events
        mechanism: The decoder drops named events without data by default; enabling them changes cached results and decoder identity.
        wrong_pattern: Consume an empty completion event without enabling its decoder option.
        correct_pattern: Set dispatchEmptyNamedEvents when the declared event Schema accepts empty data.
        source: src/http/streamed-query.ts
        priority: HIGH
        status: active
      - mistake: Leave accumulated retention implicit
        mechanism: Raw accumulated key and options builders require maxChunks; configured descendants may inherit it.
        wrong_pattern: rpc.events.watch.streamedOptions({ input })
        correct_pattern: Choose a finite maxChunks bound or the unbounded literal, locally or through configureUtils.
        source: src/core/configure-utils.ts
        priority: HIGH
        status: active
      - mistake: Assume shared callbacks have one leaf contract
        mechanism: Root and branch policies span heterogeneous descendants and receive unknown contract values.
        wrong_pattern: Read a specific result field from a root policy callback.
        correct_pattern: Move contract-dependent callbacks into a leaf configuration or a leaf entry in paths.
        source: src/core/configure-utils.ts
        priority: HIGH
        status: active
      - mistake: Mutate or transfer a prepared input
        mechanism: Prepared input retains mutable values and a leaf owner.
        wrong_pattern: Reuse a handle after changing nested request values or replacing the utility tree.
        correct_pattern: Keep retained values unchanged and prepare a new handle for each input and owner.
        source: src/core/prepared-input.ts
        priority: HIGH
        status: active
      - mistake: Assume count-based publication flushes a quiet stream
        mechanism: Without a deadline, pending events wait for the count, completion, or failure.
        wrong_pattern: Use a large publicationBatchSize for infrequent updates without a deadline.
        correct_pattern: Set publicationMaxWaitMs or use a batch size of one.
        source: src/core/stream-publication.ts
        priority: HIGH
        status: active
      - mistake: Reuse an accumulated key across incompatible policies
        mechanism: Retention and refetch policy change representation and normalized identity; raw builders require an explicit retention choice.
        wrong_pattern: rpc.events.watch.streamedKey(input)
        correct_pattern: Use the options queryKey or streamedKey(input, policy) with matching explicit or configured retention.
        source: src/rpc/streamed-query.ts
        priority: HIGH
        status: active
      - mistake: Dispose resources after native cancellation alone
        mechanism: Query settlement can precede local finalization. Accepted writes and preparation can still need the runtime.
        wrong_pattern: await queryClient.cancelQueries(); await runtime.dispose()
        correct_pattern: await acceptedWorkDrain; await runtime.dispose()
        source: examples/tanstack-start/src/lib/application.ts
        priority: HIGH
        status: active
      - mistake: Track raw consumers beside their query owner and discard settled failures
        mechanism: Parallel lifetime registries can drain work while losing its finalizer Cause.
        wrong_pattern: await Promise.allSettled(consumers); await owner.dispose()
        correct_pattern: Register raw effects through the owner's signal-aware runner and drain native mutation callbacks before retirement.
        source: examples/shared/http-workflows/application.ts
        priority: HIGH
        status: active
      - mistake: Roll back an overlapping write with an old snapshot
        mechanism: Whole-list replacement erases intervening writes. Restoring a stale entity can overwrite a newer authoritative cache revision.
        wrong_pattern: queryClient.setQueryData(key, oldList)
        correct_pattern: Capture current entity fields and positions for each new write; restore them only while its optimistic cache revision remains owned.
        source: examples/vite-react/src/lib/user-writes.ts
        priority: CRITICAL
        status: active
      - mistake: Redirect late callbacks to a replacement owner
        mechanism: Mutable current-owner lookup can send private results to another cache.
        wrong_pattern: currentOwner.queryClient.setQueryData(key, result)
        correct_pattern: transaction.commit(result)
        source: examples/vite-react/src/lib/user-writes.ts
        priority: CRITICAL
        status: active
      - mistake: Hydrate rich values without paired view codecs
        mechanism: JSON loses prototypes, rich page parameters, and distinct undefined elements.
        wrong_pattern: hydrate(queryClient, JSON.parse(snapshot))
        correct_pattern: await decodeAllSelectedViewsThenHydrate(snapshot)
        source: tests/types/docs-hydration-views.ts
        priority: HIGH
        status: active
      - mistake: Construct reactive query options only once
        mechanism: Builders capture the first input and cannot follow reactive changes.
        wrong_pattern: useQuery(rpc.users.read.queryOptions({ input }))
        correct_pattern: "useQuery(() => rpc.users.read.queryOptions({ input: readInput() }))"
        source: apps/docs/src/content/docs/guides/solid-query.md
        priority: HIGH
        status: active
      - mistake: Treat a native wrapper's peer range as the library's tested framework range
        mechanism: Wrappers declare broader framework peers, while the consumer checks cover exact dependency versions and native TypeScript hook inference.
        wrong_pattern: Claim support for every Svelte, Vue, or Angular version accepted by its Query wrapper.
        correct_pattern: Use the canonical compatibility table to distinguish declared peers from checked combinations; select component compilers and build tooling under the framework's own requirements.
        source: apps/docs/src/content/docs/reference/compatibility-and-limits.md
        priority: HIGH
        status: active
      - mistake: Treat exact development pins as the consumer Effect minimum
        mechanism: Development uses coordinated Effect pins and Effect-enhanced TSRS targeting TypeScript 7.1 beta; consumers retain TypeScript 5.9 and the supported Effect floor. ADR 0035 separates compiler roles; ADR 0042 defines prospective versioning and compatibility guarantees.
        wrong_pattern: Require every consumer to upgrade whenever the development catalog changes.
        correct_pattern: Read the published peer range, coordinate Effect integrations, and check the packed Effect minimum/development/maintained-minor and Query Core floor/current matrix; distinguish ranges from exact evidence; raise the minimum only for required APIs, type contracts, or correctness fixes.
        source: apps/docs/src/content/docs/getting-started/compatibility-and-stability.md
        priority: HIGH
        status: active
      - mistake: Rely on changed metadata options after a fresh hit
        mechanism: An imperative fresh cache hit retains the existing Query options.
        wrong_pattern: await queryClient.query(newOptions); queryClient.setQueryData(key, value)
        correct_pattern: Install the policy through an observer or actual fetch before manual writes.
        source: apps/docs/src/content/docs/reference/http-builders.md
        priority: HIGH
        status: active
      - mistake: Assume shared mutation callbacks compose automatically
        mechanism: Call-site callbacks replace policy callbacks by default, and shared callbacks cannot assume the local optimistic context's shape.
        wrong_pattern: "configured.write.mutationOptions({ onSuccess: localSuccess })"
        correct_pattern: Opt into shared-before-local composition and keep onMutate at the call site.
        source: tests/query-policy.test.ts
        priority: HIGH
        status: active
      - mistake: Rely on Suspense cancellation for open streams
        mechanism: Native Suspense hooks do not support cancellation. Lifecycle cleanup needs an ordinary abort-aware query or observer.
        wrong_pattern: useSuspenseQuery(rpc.events.watch.liveOptions())
        correct_pattern: Use an ordinary Query hook or observer for a stream requiring cancellation.
        source: apps/docs/src/content/docs/guides/react-query.md
        priority: HIGH
        status: active
      - mistake: Trace only the creation of an iterable
        mechanism: The runner's Effect ends before stream consumption and local finalization.
        wrong_pattern: runPromiseExit(effect.pipe(Effect.withSpan('feed.consume')))
        correct_pattern: Acquire Effect.makeSpanScoped inside Stream.unwrap and retain it through asynchronous Stream.ensuring cleanup.
        source: tests/types/docs-stream-tracing.ts
        priority: HIGH
        status: active
    compositions:
      - library: TanStack Query
      - library: Effect
tensions:
  - name: Declared failures and native promise rejection
    skills:
      - effect-api-query
    description: Generated options declare native error types, but Promise rejections and deduplicated execution do not establish the current failed Exit or its payload.
    implication: Handle queryEffects failures through QueryClientOperationError and preserve its unknown original cause, including complete execution wrappers.
  - name: Shared waits and exclusive stream capture
    skills:
      - effect-api-query
    description: QueryClient owns shared fetches, while a stream snapshot owns its exclusive capture.
    implication: Interrupt the Effect to stop waiting for shared work or abort its stream snapshot. Use queryEffects.cancel to stop a shared query.
  - name: Library contracts and application workflows
    skills:
      - effect-api-query
    description: The package defines generated options, keys, inference, and policy binding. The application owns native providers, transports, and domain protocols.
    implication: |-
      Explain package behavior in library guidance, native consumers in
      integrations, and concrete protocols such as cancellable commands in
      runnable examples. Both apps run browser-owned HTTP recovery, sharing
      and stream workflows; Start also transfers loader descriptors into its
      hydrated request/browser boundary.
  - name: Exact identity and broad refresh
    skills:
      - effect-api-query
    description: Concrete keys include encoding and view policy while native prefixes group related entries.
    implication: Partial constructor input or omitted stream policy cannot stand in for an exact key.
  - name: Local retirement and accepted domain work
    skills:
      - effect-api-query
    description: Private cache retirement stops local side effects. It does not undo remote writes.
    implication: Keep originating-owner guards after drain and model command cancellation explicitly.
  - name: Policy reuse and call-site inference
    skills:
      - effect-api-query
    description: Shared endpoint-aware defaults reduce repetition while selected data and optimistic context depend on each invocation.
    implication: Configure utilities once per owner. Use leaf scopes for typed callbacks; shared tree and branch callbacks receive unknown contract values. Keep projections, seeds, identity, and optimistic context at the call site. Choose callback composition explicitly and preserve native execution attempts.
  - name: Measured cost and retained guarantees
    skills:
      - effect-api-query
    description: Native bundle consumers omit adapter failure, cleanup and codec guarantees. Compiler work depends on the exact language engine and workload.
    implication: Inspect retained modules and compare identical compiler workloads; enforce byte, instantiation and publication budgets without timing gates.
cross_references: []
gaps: []
