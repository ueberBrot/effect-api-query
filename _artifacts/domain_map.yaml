library:
  name: "@ueberbrot/effect-api-query"
  version: 0.3.0
  repository: https://github.com/ueberBrot/effect-api-query
  description: TanStack Query utilities derived from ready Effect RPC and HTTP clients.
  primary_framework: framework-agnostic
domains:
  - name: Contract-derived query workflows
    slug: contract-queries
    description: Choose typed cache views. Keep execution and resource lifetime under application control.
skills:
  - name: effect-api-query
    slug: effect-api-query
    domain: contract-queries
    description: Derive options and keys, coordinate cache owners, and integrate native Query consumers.
    type: core
    packages:
      - "@ueberbrot/effect-api-query"
    covers:
      - RPC construction, explicit prepared inputs, and canonical identity
      - HTTP decoded requests, SSE, multipart mutations, and metadata
      - Inferred operation types, tree/branch/leaf policy configuration, execution interception, native defaults, and view filters
      - Input-field skipping, pagination, explicit stream retention, publication deadlines, uncached event consumption, recovery, and lifetime tracing
      - Stream snapshots and request cleanup
      - Optimistic overlap, event refresh, and owner replacement
      - DTO and rich-value hydration with typed view registration
      - Native provider setup, Suspense recovery, reactive accessors, and host boundaries
    tasks:
      - Derive buffered, paginated, accumulated, live, and metadata options from a ready client.
      - Address exact stream policy keys, select supported view prefixes, and compose encoded partial native filters with explicit typed projections.
      - Reuse inferred input, cached query data, and mutation types in application modules.
      - Configure utility trees, branches, and leaves with ordered interceptors across views; select a branch view without changing key layouts.
      - Reuse owner-bound prepared inputs and match single tagged failures without flattening composite Causes.
      - Apply native defaults and scoped policies without losing call-site selection, conditional input, or explicitly undefined seed behavior; compose mutation callbacks or intercept native execution attempts.
      - Capture open streams and drain queries, preparation, and accepted writes before request disposal.
      - Hydrate every selected view into its normal decoded cache representation.
      - Preserve neighboring writes and originating ownership during mutation overlap.
      - Defer event refresh until participating writes settle.
      - Retire consumers and accepted work before acquiring a replacement owner.
      - Acquire a ready client and mount native providers with awaited cleanup.
      - Recover initial Suspense failures, retain cached data after failed refetches, and start independent reads together with native cancellation limits.
      - Recover ordered stream delivery with application-owned cursors, gap refresh, and cancellable backoff.
      - Trace the consumed Stream and its cleanup while its owning runtime remains alive.
      - Rebuild options inside native reactive framework accessors.
      - Match documentation to the installed package, distinguish declared peer requirements from checked native hook combinations, and choose an application-owned transport within documented host boundaries.
    subsystems:
      - name: RPC
        package: "@ueberbrot/effect-api-query"
        config_surface: Literal RpcGroup, flat ready client, prefix, key encoders, runner.
      - name: HTTP
        package: "@ueberbrot/effect-api-query"
        config_surface: Literal HttpApi, ready client, prefix, request encoders, runner.
    reference_candidates:
      - topic: Adapter inputs and capabilities
        reason: RPC construction and HTTP decoded containers differ.
      - topic: Cache workflows
        reason: The library defines keys, policies, and native filters. Applications own writes and owner replacement.
      - topic: Hydration and SSR
        reason: Captures, view codecs, and preparation require request lifetime.
      - topic: Frameworks and hosts
        reason: Native providers, Suspense recovery, hook overloads, and transport boundaries depend on the integration. The package does not provide these services.
    failure_modes:
      - mistake: Rely on call order to determine configuration specificity
        mechanism: Configuration layers retain their tree, branch, or leaf scope across repeated calls.
        wrong_pattern: Expect a later tree policy to replace an existing leaf policy.
        correct_pattern: Configure the intended scope; later values replace earlier ones within that same scope.
        source: src/core/configure-utils.ts
        priority: HIGH
        status: active
      - mistake: Drop a protocol's empty named SSE events
        mechanism: The decoder drops named events without data by default; enabling them changes cached results and decoder identity.
        wrong_pattern: Consume an empty completion event without enabling its decoder option.
        correct_pattern: Set dispatchEmptyNamedEvents when the declared event Schema accepts empty data.
        source: src/http/streamed-query.ts
        priority: HIGH
        status: active
      - mistake: Leave accumulated retention implicit
        mechanism: Raw accumulated key and options builders require maxChunks; configured descendants may inherit it.
        wrong_pattern: rpc.events.watch.streamedOptions({ input })
        correct_pattern: Choose a finite maxChunks bound or the unbounded literal, locally or through configureUtils.
        source: src/core/configure-utils.ts
        priority: HIGH
        status: active
      - mistake: Assume shared callbacks have one leaf contract
        mechanism: Root and branch policies span heterogeneous descendants and receive unknown contract values.
        wrong_pattern: Read a specific result field from a root policy callback.
        correct_pattern: Move contract-dependent callbacks into the leaf scoped configuration.
        source: src/core/configure-utils.ts
        priority: HIGH
        status: active
      - mistake: Mutate or transfer a prepared input
        mechanism: A handle retains execution input and belongs to one leaf; mutating it can make execution disagree with its frozen key.
        wrong_pattern: Reuse a handle after changing nested request values or replacing the utility tree.
        correct_pattern: Keep retained values unchanged and prepare a new handle for each input and owner.
        source: src/core/prepared-input.ts
        priority: HIGH
        status: active
      - mistake: Assume count-based publication flushes a quiet stream
        mechanism: Without a deadline, pending events wait for the count, completion, or failure.
        wrong_pattern: Use a large publicationBatchSize for infrequent updates without a deadline.
        correct_pattern: Set publicationMaxWaitMs or use a batch size of one.
        source: src/core/stream-publication.ts
        priority: HIGH
        status: active
      - mistake: Reuse an accumulated key across incompatible policies
        mechanism: Retention and refetch policy change representation and normalized identity; raw builders require an explicit retention choice.
        wrong_pattern: rpc.events.watch.streamedKey(input)
        correct_pattern: Use the options queryKey or streamedKey(input, policy) with matching explicit or configured retention.
        source: src/rpc/streamed-query.ts
        priority: HIGH
        status: active
      - mistake: Dispose resources after native cancellation alone
        mechanism: Query settlement can precede local finalization. Accepted writes and preparation can still need the runtime.
        wrong_pattern: await queryClient.cancelQueries(); await runtime.dispose()
        correct_pattern: await acceptedWorkDrain; await runtime.dispose()
        source: examples/tanstack-start/src/lib/application.ts
        priority: HIGH
        status: active
      - mistake: Roll back an overlapping write with an old snapshot
        mechanism: Whole-list replacement erases intervening writes. Restoring a stale entity can overwrite a newer authoritative cache revision.
        wrong_pattern: queryClient.setQueryData(key, oldList)
        correct_pattern: Capture current entity fields and positions for each new write; restore them only while its optimistic cache revision remains owned.
        source: examples/vite-react/src/lib/user-writes.ts
        priority: CRITICAL
        status: active
      - mistake: Redirect late callbacks to a replacement owner
        mechanism: Mutable current-owner lookup can send private results to another cache.
        wrong_pattern: currentOwner.queryClient.setQueryData(key, result)
        correct_pattern: transaction.commit(result)
        source: examples/vite-react/src/lib/user-writes.ts
        priority: CRITICAL
        status: active
      - mistake: Hydrate rich values without paired view codecs
        mechanism: JSON loses prototypes, rich page parameters, and distinct undefined elements.
        wrong_pattern: hydrate(queryClient, JSON.parse(snapshot))
        correct_pattern: await decodeAllSelectedViewsThenHydrate(snapshot)
        source: tests/types/docs-hydration-views.ts
        priority: HIGH
        status: active
      - mistake: Construct reactive query options only once
        mechanism: Builders capture the first input and cannot follow reactive changes.
        wrong_pattern: useQuery(rpc.users.read.queryOptions({ input }))
        correct_pattern: "useQuery(() => rpc.users.read.queryOptions({ input: readInput() }))"
        source: apps/docs/src/content/docs/guides/solid-query.md
        priority: HIGH
        status: active
      - mistake: Treat a native wrapper's peer range as the library's tested framework range
        mechanism: Wrappers declare broader framework peers, while the consumer checks cover exact dependency versions and native TypeScript hook inference.
        wrong_pattern: Claim support for every Svelte, Vue, or Angular version accepted by its Query wrapper.
        correct_pattern: Use the canonical compatibility table to distinguish declared peers from checked combinations; select component compilers and build tooling under the framework's own requirements.
        source: apps/docs/src/content/docs/reference/compatibility-and-limits.md
        priority: HIGH
        status: active
      - mistake: Rely on changed metadata options after a fresh hit
        mechanism: An imperative fresh cache hit retains the existing Query options.
        wrong_pattern: await queryClient.query(newOptions); queryClient.setQueryData(key, value)
        correct_pattern: Install the policy through an observer or actual fetch before manual writes.
        source: apps/docs/src/content/docs/reference/http-builders.md
        priority: HIGH
        status: active
      - mistake: Assume shared mutation callbacks compose automatically
        mechanism: Call-site callbacks replace policy callbacks by default, and shared callbacks cannot assume the local optimistic context's shape.
        wrong_pattern: "configured.write.mutationOptions({ onSuccess: localSuccess })"
        correct_pattern: Opt into shared-before-local composition and keep onMutate at the call site.
        source: tests/query-policy.test.ts
        priority: HIGH
        status: active
      - mistake: Rely on Suspense cancellation for open streams
        mechanism: Native Suspense hooks do not support cancellation. Lifecycle cleanup needs an ordinary abort-aware query or observer.
        wrong_pattern: useSuspenseQuery(rpc.events.watch.liveOptions())
        correct_pattern: Use an ordinary Query hook or observer for a stream requiring cancellation.
        source: apps/docs/src/content/docs/guides/react-query.md
        priority: HIGH
        status: active
      - mistake: Trace only the creation of an iterable
        mechanism: The runner's Effect ends before stream consumption and local finalization.
        wrong_pattern: runPromiseExit(effect.pipe(Effect.withSpan('feed.consume')))
        correct_pattern: Acquire Effect.makeSpanScoped inside Stream.unwrap and retain it through asynchronous Stream.ensuring cleanup.
        source: tests/types/docs-stream-tracing.ts
        priority: HIGH
        status: active
    compositions:
      - library: TanStack Query
      - library: Effect
tensions:
  - name: Library contracts and application workflows
    skills:
      - effect-api-query
    description: The package defines generated options, keys, inference, and policy binding. The application owns native providers, transports, and domain protocols.
    implication: Explain package behavior in library guidance, native consumers in integrations, and concrete protocols such as cancellable commands in runnable examples.
  - name: Exact identity and broad refresh
    skills:
      - effect-api-query
    description: Concrete keys include encoding and view policy while native prefixes group related entries.
    implication: Partial constructor input or omitted stream policy cannot stand in for an exact key.
  - name: Local retirement and accepted domain work
    skills:
      - effect-api-query
    description: Private cache retirement stops local side effects. It does not undo remote writes.
    implication: Keep originating-owner guards after drain and model command cancellation explicitly.
  - name: Policy reuse and call-site inference
    skills:
      - effect-api-query
    description: Shared endpoint-aware defaults reduce repetition while selected data and optimistic context depend on each invocation.
    implication: Configure utilities once per owner. Use leaf scopes for typed callbacks; shared tree and branch callbacks receive unknown contract values. Keep projections, seeds, identity, and optimistic context at the call site. Choose callback composition explicitly and preserve native execution attempts.
cross_references: []
gaps: []
